<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Habit Tracker</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f8f5ff;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
}

h1{
    text-align:center;
    color:#6d5dfc;
}

.card{
    background:white;
    padding:18px;
    border-radius:20px;
    margin-top:15px;
    box-shadow:0 5px 15px #ddd;
}

input{
    width:70%;
    padding:12px;
    border-radius:15px;
    border:1px solid #ddd;
}

button{
    padding:12px;
    border:none;
    border-radius:15px;
    background:#8b7cff;
    color:white;
}

.habit-title{
    font-size:20px;
    font-weight:bold;
}

.streak{
    margin-top:10px;
    color:#ff8c42;
    font-weight:bold;
}

.today{
    margin-top:15px;
    padding:15px;
    border-radius:15px;
    background:#eee;
    text-align:center;
    cursor:pointer;
}

.done{
    background:#8ee3a8;
}

</style>

</head>


<body>


<div class="container">

<h1>🌱 Habit Tracker</h1>


<div class="card">

<input id="habitInput" placeholder="New habit">

<button onclick="addHabit()">Add</button>

</div>


<button onclick="login()" style="margin-top:15px;">
Sign in with Google
</button>


<div id="habits"></div>


</div>




<script type="module">


import {initializeApp} 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
getFirestore,
collection,
addDoc,
query,
where,
onSnapshot,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";




// YOUR FIREBASE CONFIG

const firebaseConfig = {

apiKey:"AIzaSyAMBt9ynXNFE4N2QjoqoZEVV3QqF8VRf8",

authDomain:"habit-tracker-c220c.firebaseapp.com",

projectId:"habit-tracker-c220c",

storageBucket:"habit-tracker-c220c.firebasestorage.app",

messagingSenderId:"949200336897",

appId:"1:949200336897:web:49f8aab34bda6e53c06800",

measurementId:"G-YHPSPWXTL5"

};



const app = initializeApp(firebaseConfig);

const db=getFirestore(app);

const auth=getAuth(app);



let user=null;

let habits=[];



// LOGIN

window.login=function(){

const provider=new GoogleAuthProvider();

signInWithPopup(auth,provider);

};




onAuthStateChanged(auth,u=>{

user=u;

if(user){

loadHabits();

}

});





function today(){

return new Date()
.toISOString()
.split("T")[0];

}




// ADD HABIT

window.addHabit=async function(){


let name=document
.getElementById("habitInput")
.value
.trim();


if(!name || !user)return;



await addDoc(
collection(db,"habits"),
{

uid:user.uid,

name:name,

history:{},

streak:0,

lastUpdated:null,

createdAt:today()

});


document.getElementById("habitInput").value="";


};







// LOAD

function loadHabits(){


let q=query(
collection(db,"habits"),
where("uid","==",user.uid)
);



onSnapshot(q,snapshot=>{


habits=[];


snapshot.forEach(d=>{

habits.push({

id:d.id,
...d.data()

});


});


render();


});


}






// TOGGLE TODAY

window.toggleDay=async function(id){


let habit=habits.find(h=>h.id===id);


if(!habit)return;



if(!habit.history){

habit.history={};

}



let date=today();



habit.history[date]=
!habit.history[date];





let streak=0;


let current=new Date();



while(true){


let key=current
.toISOString()
.split("T")[0];


if(habit.history[key]){


streak++;


current.setDate(
current.getDate()-1
);


}else{

break;

}

}



await updateDoc(
doc(db,"habits",id),
{

history:habit.history,

streak:streak,

lastUpdated:date

});



};








// DISPLAY

function render(){


let area=document.getElementById("habits");


area.innerHTML="";



habits.forEach(h=>{


let checked=
h.history &&
h.history[today()];



area.innerHTML += `


<div class="card">


<div class="habit-title">

${h.name}

</div>



<div class="streak">

🔥 Streak: ${h.streak || 0} days

</div>



<div

class="today ${checked?'done':''}"

onclick="toggleDay('${h.id}')"

>

${checked ? "Completed today ✓" : "Mark today complete"}

</div>


</div>


`;

});


}



</script>


</body>
</html>
